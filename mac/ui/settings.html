<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StandUp settings</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<form id="form">
  <label class="row">Work time (minutes) <input id="work" type="number" min="1" max="480" step="1"></label>
  <label class="row">Break time (minutes) <input id="rest" type="number" min="0.5" max="60" step="0.5"></label>
  <label class="row">Snooze time (minutes) <input id="snoozeTime" type="number" min="0.5" max="60" step="0.5"></label>
  <label><input id="autostart" type="checkbox"> Start when I log in</label>

  <div class="section">
    <p id="pool"></p>
    <button type="button" id="add">Add pictures...</button>
    <input id="picker" type="file" accept="image/*,.heic" multiple hidden>
    <button type="button" id="open" class="link">Open my pictures folder</button>
  </div>

  <details class="section">
    <summary>Change passcode</summary>
    <p></p>
    <input id="current" type="password" placeholder="Current passcode">
    <input id="next" type="password" placeholder="New passcode">
    <input id="again" type="password" placeholder="Type it again">
    <button type="button" id="change">Change passcode</button>
  </details>

  <p id="error" class="error section" role="alert"></p>
  <div class="actions">
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" class="primary">Save</button>
  </div>
</form>
<script src="settings.js"></script>
</body>
</html>
