<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StandUp</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<h1 id="title">StandUp</h1>
<p id="intro"></p>
<form id="form">
  <input id="first" type="password" autofocus>
  <input id="second" type="password" data-i18n-placeholder="passcode.again" hidden>
  <p id="error" class="error" role="alert"></p>
  <div class="actions">
    <button type="button" id="cancel" data-i18n="common.cancel"></button>
    <button type="submit" class="primary" data-i18n="common.ok"></button>
  </div>
</form>
<script src="common.js"></script>
<script src="passcode.js"></script>
</body>
</html>
