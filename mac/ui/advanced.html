<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StandUp</title>
<link rel="stylesheet" href="common.css">
<style>
  select { background: var(--control); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; }
  label.row > span:first-child { padding-right: 12px; }
</style>
</head>
<body>
<!-- Every change saves at once and shows a check mark; there is no Save button. -->
<form id="form">
  <label class="row"><span data-i18n="advanced.idle"></span> <span class="field"><input id="idle" type="number" min="1" max="60" step="1"><span class="mark" aria-hidden="true">✓</span></span></label>
  <label class="row"><span data-i18n="advanced.snoozes"></span> <span class="field"><input id="snoozes" type="number" min="0" max="10" step="1"><span class="mark" aria-hidden="true">✓</span></span></label>
  <label class="row"><span data-i18n="advanced.language"></span> <span class="field"><select id="language"></select><span class="mark" aria-hidden="true">✓</span></span></label>

  <div class="section">
    <p id="pool"></p>
    <button type="button" id="add" data-i18n="advanced.addPictures"></button>
    <input id="picker" type="file" accept="image/*,.heic" multiple hidden>
    <button type="button" id="open" class="link" data-i18n="advanced.openFolder"></button>
  </div>

  <p id="error" class="error section" role="alert"></p>
</form>
<script src="common.js"></script>
<script src="advanced.js"></script>
</body>
</html>
