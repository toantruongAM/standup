<!doctype html>
<meta charset="utf-8">
<title>StandUp picture generator</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#fff}svg{display:block}</style>
<body>
<script>
// Each scene is drawn in code and captured to a PNG by art/render.cmd. Open with #1 to #12.
const INK = '#2b2320', S = `stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"`;

function eyes(kind, dx, y, r, lid) {
  const one = (x, look) => {
    if (kind === 'happy') return `<path d="M${x-r},${y+4} Q${x},${y-r*1.3} ${x+r},${y+4}" fill="none" ${S} stroke-width="9"/>`;
    let s = `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${S}/>`;
    s += `<circle cx="${x+look}" cy="${y+2}" r="${r*.58}" fill="${INK}"/><circle cx="${x+look+r*.2}" cy="${y-r*.22}" r="${r*.2}" fill="#fff"/>`;
    if (kind === 'judge') s += `<path d="M${x-r-3},${y-r-3} H${x+r+3} V${y-r*.12} H${x-r-3} Z" fill="${lid}" ${S}/>`;
    if (kind === 'tired') s += `<path d="M${x-r-3},${y-r-3} H${x+r+3} V${y+r*.05} H${x-r-3} Z" fill="${lid}" ${S}/><path d="M${x-r*.8},${y+r*1.25} Q${x},${y+r*1.7} ${x+r*.8},${y+r*1.25}" fill="none" ${S} stroke-width="5"/>`;
    return s;
  };
  const look = kind === 'judge' ? r * .3 : 0;
  return one(-dx, look) + one(dx, kind === 'stare' ? -r * .2 : look);
}

function dogHead(o = {}) {
  const { fur = '#d9a066', ear = '#8a5a33', muzzle = '#f6e6cf', eye = 'wide', mouth = 'tongue', prick = false } = o;
  const ears = prick
    ? `<path d="M-92,-40 L-112,-158 L-22,-92 Z" fill="${ear}" ${S}/><path d="M92,-40 L112,-158 L22,-92 Z" fill="${ear}" ${S}/>`
    : `<path d="M-84,-74 C-168,-92 -178,38 -136,76 C-106,96 -84,32 -80,-6 Z" fill="${ear}" ${S}/><path d="M84,-74 C168,-92 178,38 136,76 C106,96 84,32 80,-6 Z" fill="${ear}" ${S}/>`;
  const mouths = {
    tongue: `<path d="M-14,62 Q-16,122 12,122 Q40,120 34,62 Z" fill="#ef7f95" ${S}/><path d="M-46,50 Q-24,76 0,52 Q24,76 46,50" fill="none" ${S}/>`,
    flat: `<path d="M-42,62 Q0,54 42,62" fill="none" ${S}/>`,
    bark: `<path d="M-48,48 Q0,36 48,48 Q44,126 0,128 Q-44,126 -48,48 Z" fill="#7c2b3b" ${S}/><path d="M-24,104 Q0,84 24,104 Q14,126 0,126 Q-14,126 -24,104 Z" fill="#ef7f95"/>`,
    leash: `<path d="M-46,56 Q0,76 46,56" fill="none" ${S}/>`
  };
  return `${ears}<ellipse cx="0" cy="0" rx="112" ry="104" fill="${fur}" ${S}/>
    <ellipse cx="0" cy="44" rx="72" ry="54" fill="${muzzle}" ${S}/>${mouths[mouth]}
    <path d="M-22,14 Q0,4 22,14 Q18,40 0,42 Q-18,40 -22,14 Z" fill="${INK}"/><ellipse cx="-7" cy="16" rx="6" ry="3.6" fill="#fff"/>
    ${eyes(eye, 47, -28, 25, fur)}`;
}

function babyHead(o = {}) {
  const { skin = '#f8d0ac', eye = 'wide', mouth = 'smile', hair = '#6d4a2e' } = o;
  const mouths = {
    smile: `<path d="M-30,46 Q0,80 30,46" fill="#fff" ${S}/>`,
    flat: `<path d="M-26,56 Q0,44 26,56" fill="none" ${S}/>`,
    yell: `<ellipse cx="0" cy="58" rx="27" ry="31" fill="#7c2b3b" ${S}/><ellipse cx="0" cy="74" rx="15" ry="11" fill="#ef7f95"/>`,
    smirk: `<path d="M-24,58 Q10,62 34,38" fill="none" ${S}/>`
  };
  return `<circle cx="-106" cy="8" r="24" fill="${skin}" ${S}/><circle cx="106" cy="8" r="24" fill="${skin}" ${S}/>
    <ellipse cx="0" cy="0" rx="110" ry="106" fill="${skin}" ${S}/>
    <path d="M-16,-102 C-44,-142 16,-160 24,-128 C28,-108 2,-112 8,-128" fill="none" stroke="${hair}" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-68" cy="32" rx="22" ry="14" fill="#f59aa6" opacity=".75"/><ellipse cx="68" cy="32" rx="22" ry="14" fill="#f59aa6" opacity=".75"/>
    ${eyes(eye, 44, -12, 24, skin)}
    <path d="M-7,18 Q0,27 7,18" fill="none" ${S} stroke-width="5"/>${mouths[mouth]}`;
}

const at = (x, y, s, body, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${body}</g>`;
const diaper = (cx, cy, w, h) => `<path d="M${cx-w},${cy-h*.5} H${cx+w} Q${cx+w*1.04},${cy+h*.8} ${cx+w*.3},${cy+h} H${cx-w*.3} Q${cx-w*1.04},${cy+h*.8} ${cx-w},${cy-h*.5} Z" fill="#fff" ${S}/><rect x="${cx-w-6}" y="${cy-h*.62}" width="${w*2+12}" height="26" rx="12" fill="#a8d8ea" ${S}/>`;
const limb = (d, c, w = 46) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+14}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const floor = (top, bottom, y = 640) => `<rect width="1200" height="${y}" fill="${top}"/><rect y="${y}" width="1200" height="${900-y}" fill="${bottom}"/>`;
const lines = (list, w = 8, c = INK) => list.map(l => `<path d="${l}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`).join('');

function caption(text) {
  const rows = text.split('|');
  const size = rows.length > 1 ? 50 : 66;
  const y = rows.length > 1 ? 810 : 846;
  return `<rect y="744" width="1200" height="156" fill="#fffdf6"/><rect y="740" width="1200" height="8" fill="${INK}"/>` +
    rows.map((r, i) => `<text x="600" y="${y + i * 62}" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, sans-serif" font-weight="700" font-size="${size}" fill="${INK}">${r}</text>`).join('');
}

const SKIN = '#f8d0ac';
const scenes = [
  // 1. Dog fused to an office chair
  () => floor('#cfe3ee', '#b89b7a') +
    `<rect x="840" y="110" width="250" height="170" rx="8" fill="#fff" ${S}/>` + lines(['M870,240 L930,190 L975,220 L1055,140']) +
    `<text x="965" y="100" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="30" fill="${INK}">MY STEPS</text>` +
    `<rect x="440" y="170" width="320" height="400" rx="46" fill="#4a5668" ${S}/>` +
    lines(['M440,190 L500,250 M500,170 L440,250 M470,175 L470,245'], 4, '#eee') + lines(['M756,195 L700,250 M700,172 L758,250 M730,175 L730,245'], 4, '#eee') +
    `<rect x="572" y="590" width="56" height="110" fill="#333" ${S}/><path d="M470,726 L730,726 M600,690 L470,726 M600,690 L730,726" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><circle cx="470" cy="738" r="18" fill="#222"/><circle cx="730" cy="738" r="18" fill="#222"/>` +
    `<path d="M410,470 C420,380 780,380 790,470 C820,540 830,640 760,650 C700,620 690,660 640,664 C590,630 540,672 490,650 C430,660 380,600 410,470 Z" fill="#d9a066" ${S}/>` +
    `<path d="M585,400 L615,400 L640,560 L600,610 L560,560 Z" fill="#d13f4c" ${S}/>` +
    at(600, 300, 1.15, dogHead({ eye: 'tired', mouth: 'tongue' }), -12),
  // 2. Pug extreme close-up
  () => `<rect width="1200" height="900" fill="#ffe08a"/>` +
    lines(['M90,100 L190,160', 'M1110,100 L1010,160', 'M60,330 L170,335', 'M1140,330 L1030,335'], 12, '#e8a93f') +
    at(600, 440, 2.85, dogHead({ fur: '#e7c79d', ear: '#4a3a30', muzzle: '#5a483c', eye: 'stare', mouth: 'flat' })) +
    lines(['M545,190 Q600,160 655,190', 'M565,226 Q600,208 635,226'], 9),
  // 3. Dog brought the leash
  () => floor('#bfe6c4', '#8fc27a') +
    `<rect x="850" y="150" width="240" height="490" fill="#b5743a" ${S}/><circle cx="1050" cy="400" r="15" fill="#ffd166" ${S}/>` +
    `<path d="M430,640 C400,470 460,360 600,360 C740,360 800,470 770,640 Z" fill="#c98a4b" ${S}/><ellipse cx="500" cy="660" rx="66" ry="32" fill="#c98a4b" ${S}/><ellipse cx="700" cy="660" rx="66" ry="32" fill="#c98a4b" ${S}/>` +
    `<path d="M770,590 C860,600 870,520 850,490" fill="none" stroke="${INK}" stroke-width="42" stroke-linecap="round"/><path d="M770,590 C860,600 870,520 850,490" fill="none" stroke="#c98a4b" stroke-width="28" stroke-linecap="round"/>` +
    lines(['M880,470 Q905,500 895,540', 'M915,450 Q950,495 935,555'], 8) +
    at(600, 270, 1.45, dogHead({ fur: '#c98a4b', ear: '#7a4f2a', eye: 'wide', mouth: 'leash' })) +
    lines(['M600,392 C560,480 560,560 620,590 C690,620 640,700 560,690'], 14, '#d13f4c') +
    `<circle cx="540" cy="684" r="34" fill="none" stroke="#d13f4c" stroke-width="14"/>`,
  // 4. Very long dachshund
  () => floor('#ffd6c9', '#f2a68c', 690) +
    (() => {
      const d = 'M120,560 C330,700 480,300 680,380 C820,440 800,620 960,520';
      const legs = [[210,620],[300,610],[470,470],[550,425],[700,470],[780,540],[880,600]].map(([x,y]) => `<rect x="${x-14}" y="${y}" width="30" height="${Math.max(60, 716-y)}" rx="14" fill="#7a3f1d" ${S}/>`).join('');
      return legs + `<path d="M95,540 C60,500 50,470 40,440" fill="none" stroke="${INK}" stroke-width="30" stroke-linecap="round"/><path d="M95,540 C60,500 50,470 40,440" fill="none" stroke="#a65a2c" stroke-width="16" stroke-linecap="round"/>` +
        `<path d="${d}" fill="none" stroke="${INK}" stroke-width="122" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#a65a2c" stroke-width="108" stroke-linecap="round"/>`;
    })() +
    at(1010, 390, 1.1, dogHead({ fur: '#a65a2c', ear: '#6e3817', muzzle: '#d6a073', eye: 'happy', mouth: 'tongue' }), 8),
  // 5. Drill sergeant
  () => `<rect width="1200" height="900" fill="#c9b98b"/>` +
    Array.from({ length: 7 }, (_, i) => `<path d="M600,420 L${-200 + i * 267},-60 L${-90 + i * 267},-60 Z" fill="#b8a673"/>`).join('') +
    `<path d="M240,760 C260,600 420,560 600,560 C780,560 940,600 960,760 Z" fill="#6d7a45" ${S}/><path d="M560,560 L600,650 L640,560 Z" fill="#fff" ${S}/><path d="M600,600 V760" stroke="${INK}" stroke-width="7"/>` +
    at(600, 390, 1.6, dogHead({ fur: '#b98a58', ear: '#6e4c2c', eye: 'wide', mouth: 'bark' })) +
    `<path d="M480,300 C500,180 700,180 720,300 Z" fill="#7b6a3c" ${S}/><path d="M340,306 Q600,240 860,306 Q600,352 340,306 Z" fill="#8d7a46" ${S}/><circle cx="600" cy="240" r="24" fill="#ffd166" ${S}/>` +
    lines(['M300,500 L170,470', 'M300,570 L150,590', 'M900,500 L1030,470', 'M900,570 L1050,590'], 15),
  // 6. Corgi walking away
  () => floor('#bde0fe', '#a7c957', 520) +
    `<path d="M480,900 L560,520 H640 L720,900 Z" fill="#eadfca"/>` +
    `<rect x="440" y="560" width="72" height="130" rx="26" fill="#e7933b" ${S}/><rect x="688" y="560" width="72" height="130" rx="26" fill="#e7933b" ${S}/>` +
    `<ellipse cx="600" cy="410" rx="240" ry="218" fill="#e7933b" ${S}/>` +
    `<circle cx="500" cy="500" r="124" fill="#fff8ea" ${S}/><circle cx="700" cy="500" r="124" fill="#fff8ea" ${S}/><ellipse cx="600" cy="486" rx="60" ry="120" fill="#fff8ea"/>` +
    `<path d="M600,436 V590" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><ellipse cx="600" cy="382" rx="40" ry="32" fill="#e7933b" ${S}/>` +
    lines(['M545,330 Q600,290 655,330', 'M520,300 Q600,240 680,300'], 8) +
    at(870, 220, 1, dogHead({ fur: '#e7933b', ear: '#c56f22', eye: 'happy', mouth: 'tongue', prick: true }), 14),
  // 7. Judgmental baby
  () => floor('#f4d6ec', '#d9b3d4') +
    `<ellipse cx="600" cy="540" rx="150" ry="150" fill="${SKIN}" ${S}/>` + diaper(600, 620, 150, 100) +
    limb('M490,520 Q600,590 700,525', SKIN) + limb('M710,510 Q600,560 500,505', SKIN) +
    `<ellipse cx="530" cy="735" rx="60" ry="28" fill="${SKIN}" ${S}/><ellipse cx="670" cy="735" rx="60" ry="28" fill="${SKIN}" ${S}/>` +
    at(600, 270, 1.75, babyHead({ eye: 'judge', mouth: 'flat' })),
  // 8. Baby manager
  () => floor('#dbe7f3', '#8d99ae') +
    `<rect x="110" y="90" width="300" height="190" rx="8" fill="#fff" ${S}/>` + `<text x="260" y="146" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="32" fill="${INK}">BUTT ACTIVITY</text>` + lines(['M150,180 H360', 'M150,250 L200,248 L260,252 L360,250'], 8, '#d13f4c') +
    `<path d="M410,740 C410,500 470,440 600,440 C730,440 790,500 790,740 Z" fill="#2f3b52" ${S}/><path d="M545,442 L600,560 L655,442 Z" fill="#fff" ${S}/><path d="M582,462 H618 L630,620 L600,660 L570,620 Z" fill="#e63946" ${S}/>` +
    `<rect x="720" y="430" width="230" height="290" rx="12" fill="#b5743a" ${S}/><rect x="745" y="465" width="180" height="235" fill="#fff" ${S}/><rect x="790" y="412" width="90" height="42" rx="8" fill="#ccc" ${S}/>` +
    `<text x="835" y="530" text-anchor="middle" font-family="Segoe UI" font-weight="800" font-size="38" fill="#d13f4c">F</text><text x="835" y="584" text-anchor="middle" font-family="Segoe UI" font-weight="600" font-size="24" fill="${INK}">needs to</text><text x="835" y="620" text-anchor="middle" font-family="Segoe UI" font-weight="600" font-size="24" fill="${INK}">walk more</text>` +
    limb('M748,530 L738,640', '#2f3b52', 54) + `<circle cx="738" cy="668" r="34" fill="${SKIN}" ${S}/>` +
    at(600, 270, 1.5, babyHead({ eye: 'judge', mouth: 'smirk', hair: '#2b2320' })) +
    `<circle cx="534" cy="252" r="52" fill="none" ${S} stroke-width="9"/><circle cx="666" cy="252" r="52" fill="none" ${S} stroke-width="9"/><path d="M586,252 H614" ${S} stroke-width="9"/>`,
  // 9. Baby lifting rattles
  () => floor('#ffcad4', '#6c757d') +
    `<rect x="170" y="186" width="860" height="26" rx="12" fill="#adb5bd" ${S}/>` +
    `<circle cx="160" cy="198" r="108" fill="#ffd166" ${S}/><circle cx="1040" cy="198" r="108" fill="#ef476f" ${S}/><circle cx="120" cy="160" r="12" fill="#fff"/><circle cx="185" cy="240" r="14" fill="#fff"/><circle cx="1010" cy="160" r="14" fill="#fff"/><circle cx="1075" cy="240" r="12" fill="#fff"/>` +
    limb('M470,470 Q380,370 420,206', SKIN, 58) + limb('M730,470 Q820,370 780,206', SKIN, 58) +
    `<path d="M395,350 q24,-40 56,-10" fill="none" ${S}/><path d="M805,350 q-24,-40 -56,-10" fill="none" ${S}/>` +
    `<ellipse cx="600" cy="560" rx="170" ry="150" fill="${SKIN}" ${S}/>` + diaper(600, 630, 165, 92) +
    `<ellipse cx="520" cy="735" rx="66" ry="28" fill="${SKIN}" ${S}/><ellipse cx="680" cy="735" rx="66" ry="28" fill="${SKIN}" ${S}/>` +
    at(600, 340, 1.4, babyHead({ eye: 'wide', mouth: 'yell' })) +
    `<path d="M437,298 Q600,252 763,298" fill="none" stroke="#06d6a0" stroke-width="34"/>` +
    lines(['M455,420 q-14,28 0,38 q14,-10 0,-38 Z'], 5, '#4cc9f0'),
  // 10. Speed-crawling baby
  () => floor('#caf0f8', '#ffb703', 560) +
    lines(['M40,340 H270', 'M20,440 H220', 'M60,540 H260', 'M90,240 H260'], 14, '#ffffff') +
    `<ellipse cx="170" cy="660" rx="72" ry="42" fill="#fff" ${S}/><ellipse cx="90" cy="690" rx="46" ry="28" fill="#fff" ${S}/>` +
    limb('M430,560 L370,690', SKIN, 62) + limb('M790,520 L880,680', SKIN, 58) +
    `<ellipse cx="580" cy="470" rx="250" ry="140" fill="${SKIN}" ${S}/>` +
    `<path d="M330,445 C330,380 480,350 500,370 C540,430 530,560 490,600 C430,620 340,560 330,445 Z" fill="#fff" ${S}/>` +
    limb('M520,570 L470,690', SKIN, 62) + limb('M720,570 L730,700', SKIN, 58) +
    at(860, 300, 1.45, babyHead({ eye: 'wide', mouth: 'smile' }), 8) +
    `<path d="M705,262 Q860,202 1020,288" fill="none" stroke="#e63946" stroke-width="34" stroke-linecap="round"/>`,
  // 11. Baby rides dog
  () => floor('#fcd5a4', '#c58f55') +
    `<circle cx="1040" cy="130" r="72" fill="#ffd166"/>` +
    `<path d="M120,330 C70,250 90,200 60,170" fill="none" stroke="${INK}" stroke-width="36" stroke-linecap="round"/><path d="M120,330 C70,250 90,200 60,170" fill="none" stroke="#9c6a3a" stroke-width="22" stroke-linecap="round"/>` +
    [240, 380, 660, 800].map(x => `<rect x="${x-30}" y="520" width="60" height="180" rx="24" fill="#9c6a3a" ${S}/>`).join('') +
    `<ellipse cx="500" cy="420" rx="420" ry="150" fill="#9c6a3a" ${S}/><path d="M340,282 C400,262 560,262 640,282 L620,430 C540,450 420,450 360,430 Z" fill="#e63946" ${S}/>` +
    at(950, 300, 1.25, dogHead({ fur: '#9c6a3a', ear: '#5f3e20', eye: 'tired', mouth: 'tongue' }), 6) +
    limb('M560,270 Q650,160 700,90', SKIN, 44) +
    `<ellipse cx="480" cy="250" rx="100" ry="100" fill="${SKIN}" ${S}/>` + limb('M420,290 L350,380', SKIN, 44) +
    at(480, 165, 1, babyHead({ eye: 'happy', mouth: 'yell' })) +
    `<path d="M375,112 C410,20 550,20 585,112 Z" fill="#8a5a33" ${S}/><path d="M290,112 Q480,166 670,112 Q480,62 290,112 Z" fill="#a0693c" ${S}/>`,
  // 12. Baby and dog hold a meeting at the door
  () => floor('#d8f3dc', '#b08968') +
    `<rect x="830" y="110" width="290" height="530" fill="#8ecae6" ${S}/><path d="M830,540 C920,480 1020,520 1120,470 V640 H830 Z" fill="#74c69d"/><circle cx="1040" cy="210" r="46" fill="#ffd166"/>` +
    `<rect x="840" y="30" width="270" height="66" rx="8" fill="#2d6a4f" ${S}/><text x="975" y="80" text-anchor="middle" font-family="Segoe UI" font-weight="800" font-size="42" fill="#fff">OUTSIDE</text>` +
    `<ellipse cx="290" cy="560" rx="125" ry="125" fill="${SKIN}" ${S}/>` + diaper(290, 620, 122, 80) + `<ellipse cx="230" cy="725" rx="52" ry="24" fill="${SKIN}" ${S}/><ellipse cx="350" cy="725" rx="52" ry="24" fill="${SKIN}" ${S}/>` +
    limb('M380,520 L560,400', SKIN, 46) + limb('M560,400 L800,350', SKIN, 0) + limb('M180,540 L140,640', SKIN, 46) +
    at(290, 325, 1.4, babyHead({ eye: 'judge', mouth: 'flat' })) +
    `<path d="M560,720 C530,540 580,440 670,440 C760,440 800,540 770,720 Z" fill="#f2c078" ${S}/><ellipse cx="605" cy="730" rx="56" ry="24" fill="#f2c078" ${S}/><ellipse cx="735" cy="730" rx="56" ry="24" fill="#f2c078" ${S}/>` +
    at(670, 330, 1.25, dogHead({ fur: '#f2c078', ear: '#c98a4b', eye: 'judge', mouth: 'flat' }))
];

const captions = [
  'This is you. Please get up.',
  'I have been watching you sit.',
  'I even brought the leash.',
  'Stretch like you mean it.',
  'ON YOUR FEET, SOLDIER!',
  'Follow this butt.',
  'I learned to walk last week.|What is your excuse?',
  'Your performance review is in.',
  'Do you even walk, bro?',
  'I am crawling and still|out-moving you.',
  'Yee-haw! Walk break!',
  'We held a meeting.|You are walking.'
];

const n = Math.max(1, Math.min(scenes.length, parseInt(location.hash.slice(1), 10) || 1));
document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">${scenes[n-1]()}${caption(captions[n-1])}</svg>`;
</script>
